name: CI (.NET)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests run in parallel slices, each on its own runner with its own Postgres container: the unit
  # tests, and the integration tests split by module. A test outside the named modules falls into "other",
  # so nothing is left out. Each slice builds the whole solution (about a minute) before its tests.
  test:
    name: Test (.NET, ${{ matrix.slice }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: unit
            target: Pottmayer.Pandora.slnx
            filter: FullyQualifiedName!~Pottmayer.Pandora.IntegrationTests
          - slice: notes
            target: tests/Pottmayer.Pandora.IntegrationTests
            filter: FullyQualifiedName~Pottmayer.Pandora.IntegrationTests.Modules.Notes.
          - slice: finances
            target: tests/Pottmayer.Pandora.IntegrationTests
            filter: FullyQualifiedName~Pottmayer.Pandora.IntegrationTests.Modules.Finances.
          - slice: communications
            target: tests/Pottmayer.Pandora.IntegrationTests
            filter: FullyQualifiedName~Pottmayer.Pandora.IntegrationTests.Modules.Communications.
          - slice: other
            target: tests/Pottmayer.Pandora.IntegrationTests
            filter: >-
              FullyQualifiedName!~Pottmayer.Pandora.IntegrationTests.Modules.Notes.&FullyQualifiedName!~Pottmayer.Pandora.IntegrationTests.Modules.Finances.&FullyQualifiedName!~Pottmayer.Pandora.IntegrationTests.Modules.Communications.
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No global.json: the machines that build Pandora run newer SDKs that still target net10.0.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # The Pottmayer.Tars.* packages come from GitHub Packages: a PAT with read:packages.
      # Dependabot's pull requests read Dependabot secrets, so the same token is stored there too.
      - name: Authenticate the GitHub Packages feed
        env:
          NUGET_GITHUB_TOKEN: ${{ secrets.NUGET_GITHUB_TOKEN }}
        run: >-
          dotnet nuget update source github --configfile nuget.config
          --username ci --password "$NUGET_GITHUB_TOKEN" --store-password-in-clear-text

      - name: Restore
        run: dotnet restore Pottmayer.Pandora.slnx

      - name: Build
        run: dotnet build Pottmayer.Pandora.slnx --no-restore --configuration Release

      # The integration tests start Postgres with Testcontainers; the runner has Docker.
      # Every test host watches appsettings*.json for changes; hundreds of hosts exhaust Linux's inotify
      # instances (128 on the runner). Polling watchers use none.
      - name: Test
        env:
          DOTNET_USE_POLLING_FILE_WATCHER: "true"
          FILTER: ${{ matrix.filter }}
        run: dotnet test ${{ matrix.target }} --no-build --configuration Release --filter "$FILTER"

  # The required check in the main and dev rulesets: green only when every slice passed. Rename both together.
  result:
    name: Build & Test (.NET)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every slice passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
