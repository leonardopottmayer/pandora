name: CI (Node)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This name is the required check in the main and dev rulesets. Rename both together.
    name: Build & Test (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # client-web uses npm (package-lock.json). Node version from client-web/.nvmrc.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client-web/.nvmrc
          cache: npm
          cache-dependency-path: client-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
