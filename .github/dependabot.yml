# Security updates ignore target-branch: they always open against main. As an app with staging, Pandora
# redoes them on dev (devkit handbook, deploying.md), so they reach staging before production.
# Each ecosystem's group takes only minor and patch updates: one routine pull request a week. Every
# major update arrives in its own pull request, to be read and tested alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # NuGet doesn't tell dev dependencies apart, so every update is a fix(deps).
  - package-ecosystem: nuget
    directory: /backend
    target-branch: dev
    ignore:
      # 3.2 and 4.x check for a license key at build time and fail the Release build (the Docker image).
      # See ImageSharpProcessor.cs.
      - dependency-name: "SixLabors.ImageSharp"
        versions: [">= 3.2.0"]
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /client-web
    target-branch: dev
    ignore:
      # typescript-eslint 8 supports TypeScript < 6.1; lift this when it supports the next major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
